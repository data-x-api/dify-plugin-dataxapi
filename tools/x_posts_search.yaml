identity:
  name: x_posts_search
  author: dataxapi
  label:
    en_US: X post search
    zh_Hans: X 帖子搜索
description:
  human:
    en_US: Find X posts by search terms, most popular or newest first; the terms may use X's own search operators, such as from:handle. $0.002 a call; errors are not charged. No sign-in to your own platform account.
    zh_Hans: 按搜索词找 X 帖子，可按热门或最新排；搜索词里可以用 X 自己的搜索语法，如 from:账号名。$0.002 一次，出错不收费。不用登录你自己的平台账号。
  llm: DataXAPI endpoint x.posts.search. Find X posts by search terms, most popular or newest first; the terms may use X's own search operators, such as from:handle. One call returns one page; for more, call again with page.next_cursor as cursor (each page is its own charged call). $0.002 a call; errors are not charged.
parameters:
- name: query
  type: string
  required: true
  form: llm
  label:
    en_US: Search terms
    zh_Hans: 搜索词
  human_description:
    en_US: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
    zh_Hans: 翻页：填上一次返回里的 page.next_cursor。每一页单独计费
  llm_description: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
- name: sort
  type: select
  required: false
  form: llm
  label:
    en_US: Sort
    zh_Hans: 排序
  human_description:
    en_US: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
    zh_Hans: 翻页：填上一次返回里的 page.next_cursor。每一页单独计费
  llm_description: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
  options:
  - value: popular
    label:
      en_US: Popular
      zh_Hans: 最热
  - value: latest
    label:
      en_US: Latest
      zh_Hans: 最新
  default: popular
- name: cursor
  type: string
  required: false
  form: llm
  label:
    en_US: Next page cursor
    zh_Hans: 翻页游标
  human_description:
    en_US: Cursor returned by the previous page
    zh_Hans: 上一页返回的游标
  llm_description: Cursor returned by the previous page
extra:
  python:
    source: tools/x_posts_search.py
