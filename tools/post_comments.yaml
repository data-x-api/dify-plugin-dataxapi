identity:
  name: post_comments
  author: dataxapi
  label:
    en_US: Post comments
    zh_Hans: 作品评论
description:
  human:
    en_US: No sign-in to your own platform account; charged per call, errors are not charged, and the price is on the endpoint's page at dataxapi.com/apis. Lists the comments under one post, video or article, one page a call.
    zh_Hans: 不用登录你自己的平台账号；按次计费、出错不收费，价格见 dataxapi.com/apis 上的接口页。列出一条作品、视频或文章下的评论，一次调用一页。
  llm: "No sign-in to the user's own platform account is needed; each call is charged per the endpoint's page at dataxapi.com/apis and errors are not charged. Lists the comments under one post on Douyin, Xiaohongshu, WeChat Channels, WeChat Official Accounts, Kuaishou, TikTok or Bilibili, as standard comment objects (text, time, author, likes, replies). One call returns one page; for more, call again with page.next_cursor as cursor (each page is its own charged call)."
parameters:
  - name: platform
    type: select
    required: true
    form: llm
    default: douyin
    label:
      en_US: Platform
      zh_Hans: 平台
    human_description:
      en_US: Which platform the post is on.
      zh_Hans: 作品所在的平台。
    llm_description: "One of: douyin, xiaohongshu, wechat_channels, wechat_mp, kuaishou, tiktok, bilibili."
    options:
      - value: douyin
        label:
          en_US: Douyin
          zh_Hans: 抖音
      - value: xiaohongshu
        label:
          en_US: Xiaohongshu (RedNote)
          zh_Hans: 小红书
      - value: wechat_channels
        label:
          en_US: WeChat Channels
          zh_Hans: 视频号
      - value: wechat_mp
        label:
          en_US: WeChat Official Account article
          zh_Hans: 公众号文章
      - value: kuaishou
        label:
          en_US: Kuaishou
          zh_Hans: 快手
      - value: tiktok
        label:
          en_US: TikTok
          zh_Hans: TikTok
      - value: bilibili
        label:
          en_US: Bilibili
          zh_Hans: 哔哩哔哩
  - name: post
    type: string
    required: true
    form: llm
    label:
      en_US: Post
      zh_Hans: 作品
    human_description:
      en_US: "The post's ID, or its link where the platform takes one: Xiaohongshu and TikTok take an ID or a link; a WeChat Official Account article takes its link."
      zh_Hans: 作品的 ID，或平台支持时的链接：小红书和 TikTok 填 ID 或链接都行；公众号文章填文章链接。
    llm_description: "The post: Douyin video ID; Xiaohongshu note ID or link (a share text with the link also works); WeChat Channels video ID (digits); WeChat Official Account article link; Kuaishou video ID (starts with 3x); TikTok video ID or link; Bilibili BV number (BV1...)."
  - name: cursor
    type: string
    required: false
    form: llm
    label:
      en_US: Cursor
      zh_Hans: 翻页游标
    human_description:
      en_US: Leave empty for the first page. For the next page, pass page.next_cursor from the previous result; each page is a charged call.
      zh_Hans: 第一页留空。下一页把上一次结果里的 page.next_cursor 填进来；每一页都是一次收费调用。
    llm_description: Empty for the first page; otherwise page.next_cursor from the previous result, unchanged.
extra:
  python:
    source: tools/post_comments.py
