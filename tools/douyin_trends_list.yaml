identity:
  name: douyin_trends_list
  author: dataxapi
  label:
    en_US: Douyin hot search board
    zh_Hans: 抖音热榜
description:
  human:
    en_US: 'Get a Douyin hot list: hot searches, rising topics, topic ranking, top search terms or the music chart, with rank and heat. $0.002 a call; errors are not charged. No sign-in to your own platform account.'
    zh_Hans: 取抖音的热点榜单：热搜榜、实时上升热点、话题热榜、热门搜索词或音乐榜，带名次和热度。$0.002 一次，出错不收费。不用登录你自己的平台账号。
  llm: 'DataXAPI endpoint douyin.trends.list. Get a Douyin hot list: hot searches, rising topics, topic ranking, top search terms or the music chart, with rank and heat. One call returns one page; for more, call again with page.next_cursor as cursor (each page is its own charged call). $0.002 a call; errors are not charged.'
parameters:
- name: board
  type: select
  required: false
  form: llm
  label:
    en_US: Board
    zh_Hans: 榜单
  human_description:
    en_US: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
    zh_Hans: 翻页：填上一次返回里的 page.next_cursor。每一页单独计费
  llm_description: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
  options:
  - value: hot_search
    label:
      en_US: Hot search
      zh_Hans: 热搜榜
  - value: rising
    label:
      en_US: Rising
      zh_Hans: 上升热点
  - value: topics
    label:
      en_US: Topics
      zh_Hans: 话题热榜
  - value: searches
    label:
      en_US: Searches
      zh_Hans: 热门搜索词
  - value: music
    label:
      en_US: Music
      zh_Hans: 音乐榜
  default: hot_search
- name: cursor
  type: string
  required: false
  form: llm
  label:
    en_US: Next page cursor
    zh_Hans: 翻页游标
  human_description:
    en_US: Cursor returned by the previous page
    zh_Hans: 上一页返回的游标
  llm_description: Cursor returned by the previous page
extra:
  python:
    source: tools/douyin_trends_list.py
