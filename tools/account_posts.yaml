identity:
  name: account_posts
  author: dataxapi
  label:
    en_US: Account posts
    zh_Hans: 账号作品列表
description:
  human:
    en_US: No sign-in to your own platform account; charged per call, errors are not charged, and the price is on the endpoint's page at dataxapi.com/apis. Lists the posts or videos one account published, one page a call.
    zh_Hans: 不用登录你自己的平台账号；按次计费、出错不收费，价格见 dataxapi.com/apis 上的接口页。列出一个账号发过的作品或视频，一次调用一页。
  llm: "No sign-in to the user's own platform account is needed; each call is charged per the endpoint's page at dataxapi.com/apis and errors are not charged. Lists the posts one account published on Douyin, Xiaohongshu, WeChat Channels, Kuaishou, TikTok or Bilibili, as standard post objects (text, time, author, likes, comments, shares, views). One call returns one page; for more, call again with page.next_cursor as cursor (each page is its own charged call)."
parameters:
  - name: platform
    type: select
    required: true
    form: llm
    default: douyin
    label:
      en_US: Platform
      zh_Hans: 平台
    human_description:
      en_US: Which platform the account is on.
      zh_Hans: 账号所在的平台。
    llm_description: "One of: douyin, xiaohongshu, wechat_channels, kuaishou, tiktok, bilibili."
    options:
      - value: douyin
        label:
          en_US: Douyin
          zh_Hans: 抖音
      - value: xiaohongshu
        label:
          en_US: Xiaohongshu (RedNote)
          zh_Hans: 小红书
      - value: wechat_channels
        label:
          en_US: WeChat Channels
          zh_Hans: 视频号
      - value: kuaishou
        label:
          en_US: Kuaishou
          zh_Hans: 快手
      - value: tiktok
        label:
          en_US: TikTok
          zh_Hans: TikTok
      - value: bilibili
        label:
          en_US: Bilibili
          zh_Hans: 哔哩哔哩
  - name: account
    type: string
    required: true
    form: llm
    label:
      en_US: Account
      zh_Hans: 账号
    human_description:
      en_US: "Douyin: the sec_uid (starts with MS4w). Xiaohongshu: the user ID or the profile link. WeChat Channels: the ID starting with v2_ and ending in @finder. Kuaishou and Bilibili: the numeric user ID. TikTok: the handle without @."
      zh_Hans: 抖音：sec_uid（以 MS4w 开头）。小红书：用户 ID 或主页链接。视频号：以 v2_ 开头、@finder 结尾的 ID。快手、B站：数字用户 ID。TikTok：不带 @ 的用户名。
    llm_description: "The account: Douyin sec_uid (MS4w...); Xiaohongshu user ID (24 hex characters) or profile link; WeChat Channels ID (v2_...@finder); Kuaishou user ID (digits); TikTok handle without @; Bilibili mid (digits)."
  - name: cursor
    type: string
    required: false
    form: llm
    label:
      en_US: Cursor
      zh_Hans: 翻页游标
    human_description:
      en_US: Leave empty for the first page. For the next page, pass page.next_cursor from the previous result; each page is a charged call.
      zh_Hans: 第一页留空。下一页把上一次结果里的 page.next_cursor 填进来；每一页都是一次收费调用。
    llm_description: Empty for the first page; otherwise page.next_cursor from the previous result, unchanged.
extra:
  python:
    source: tools/account_posts.py
