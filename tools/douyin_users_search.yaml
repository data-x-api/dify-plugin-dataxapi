identity:
  name: douyin_users_search
  author: dataxapi
  label:
    en_US: Douyin user search
    zh_Hans: 抖音用户搜索
description:
  human:
    en_US: 'Search Douyin accounts by terms, a page at a time: account ID, display name, avatar, follower count, post count, total likes. $0.002 a call; errors are not charged. No sign-in to your own platform account.'
    zh_Hans: 按搜索词取一页抖音账号：账号编号、显示名、头像、粉丝数、作品数、获赞总数。$0.002 一次，出错不收费。不用登录你自己的平台账号。
  llm: 'DataXAPI endpoint douyin.users.search. Search Douyin accounts by terms, a page at a time: account ID, display name, avatar, follower count, post count, total likes. One call returns one page; for more, call again with page.next_cursor as cursor (each page is its own charged call). $0.002 a call; errors are not charged.'
parameters:
- name: query
  type: string
  required: true
  form: llm
  label:
    en_US: Search terms
    zh_Hans: 搜索词
  human_description:
    en_US: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
    zh_Hans: 翻页：填上一次返回里的 page.next_cursor。每一页单独计费
  llm_description: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
- name: cursor
  type: string
  required: false
  form: llm
  label:
    en_US: Next page cursor
    zh_Hans: 翻页游标
  human_description:
    en_US: Cursor returned by the previous page
    zh_Hans: 上一页返回的游标
  llm_description: Cursor returned by the previous page
extra:
  python:
    source: tools/douyin_users_search.py
