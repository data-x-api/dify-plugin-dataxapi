identity:
  name: douyin_index_keywords_history
  author: dataxapi
  label:
    en_US: Douyin trend-index keyword trends
    zh_Hans: 抖音巨量算数关键词热度趋势
description:
  human:
    en_US: Get the day-by-day search index and composite index of a keyword, or of one to five keywords at once, on Douyin over a date range, from 巨量算数 (the Douyin index), with the daily averages of the period, of the one before and of a year earlier. An index is the platform's score of volume, not a count of searches; days are calendar days in China time (UTC+8). $0.006 a call; errors are not charged. No sign-in to your own platform account.
    zh_Hans: 按一个关键词或一次 1 到 5 个关键词，加起止日期，取每个词在抖音上逐日的搜索指数和综合指数（巨量算数，也就是抖音指数），带本期、上期和去年同期的日均值。指数是平台算出的热度分，不是搜索次数；日期是中国时间（UTC+8）的自然日。$0.006 一次，出错不收费。不用登录你自己的平台账号。
  llm: DataXAPI endpoint douyin.index.keywords.history. Get the day-by-day search index and composite index of a keyword, or of one to five keywords at once, on Douyin over a date range, from 巨量算数 (the Douyin index), with the daily averages of the period, of the one before and of a year earlier. An index is the platform's score of volume, not a count of searches; days are calendar days in China time (UTC+8). One call, one answer. $0.006 a call; errors are not charged.
parameters:
- name: since
  type: string
  required: true
  form: llm
  label:
    en_US: From (date)
    zh_Hans: 开始日期
  human_description:
    en_US: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
    zh_Hans: 翻页：填上一次返回里的 page.next_cursor。每一页单独计费
  llm_description: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
- name: until
  type: string
  required: true
