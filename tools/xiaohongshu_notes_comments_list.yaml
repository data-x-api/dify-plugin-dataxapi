identity:
  name: xiaohongshu_notes_comments_list
  author: dataxapi
  label:
    en_US: Xiaohongshu note comments
    zh_Hans: 小红书笔记评论
description:
  human:
    en_US: 'Get a page of top-level comments on a Xiaohongshu note by ID or link, newest first or hottest first: text, commenter, likes, reply count, time posted. $0.02 a call; errors are not charged. No sign-in to your own platform account.'
    zh_Hans: 按笔记编号或链接取一页小红书一级评论，按时间从新到旧，也可按最热：正文、评论者、点赞数、回复数、发布时间。$0.02 一次，出错不收费。不用登录你自己的平台账号。
  llm: 'DataXAPI endpoint xiaohongshu.notes.comments.list. Get a page of top-level comments on a Xiaohongshu note by ID or link, newest first or hottest first: text, commenter, likes, reply count, time posted. One call returns one page; for more, call again with page.next_cursor as cursor (each page is its own charged call). $0.02 a call; errors are not charged.'
parameters:
- name: id
  type: string
  required: false
  form: llm
  label:
    en_US: Note ID
    zh_Hans: 笔记编号
  human_description:
    en_US: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
    zh_Hans: 翻页：填上一次返回里的 page.next_cursor。每一页单独计费
  llm_description: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
- name: url
  type: string
  required: false
  form: llm
  label:
    en_US: Link to the note
    zh_Hans: 笔记链接
  human_description:
    en_US: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
    zh_Hans: 翻页：填上一次返回里的 page.next_cursor。每一页单独计费
  llm_description: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
- name: sort
  type: select
  required: false
  form: llm
  label:
    en_US: Sort
    zh_Hans: 排序
  human_description:
    en_US: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
    zh_Hans: 翻页：填上一次返回里的 page.next_cursor。每一页单独计费
  llm_description: 'Next page: the page.next_cursor of the last answer. Each page is charged on its own'
  options:
  - value: latest
    label:
      en_US: Latest
      zh_Hans: 最新
  - value: popular
    label:
      en_US: Popular
      zh_Hans: 最热
  default: latest
- name: cursor
  type: string
  required: false
  form: llm
  label:
    en_US: Next page cursor
    zh_Hans: 翻页游标
  human_description:
    en_US: Cursor returned by the previous page
    zh_Hans: 上一页返回的游标
  llm_description: Cursor returned by the previous page
extra:
  python:
    source: tools/xiaohongshu_notes_comments_list.py
