identity:
  name: call_endpoint
  author: dataxapi
  label:
    en_US: Call any endpoint
    zh_Hans: 调用任意接口
description:
  human:
    en_US: No sign-in to your own platform account; charged per call, errors are not charged, and the price is on the endpoint's page at dataxapi.com/apis. Calls any DataXAPI endpoint by its ID with JSON parameters, one page a call.
    zh_Hans: 不用登录你自己的平台账号；按次计费、出错不收费，价格见 dataxapi.com/apis 上的接口页。用接口编号加 JSON 参数调用任意一个 DataXAPI 接口，一次调用一页。
  llm: "No sign-in to the user's own platform account is needed; each call is charged per the endpoint's page at dataxapi.com/apis and errors are not charged. Calls any DataXAPI endpoint by its ID (for example douyin.users.get, tiktok.videos.transcript.get, x.posts.search) with its parameters as a JSON object. Endpoint IDs, parameters and prices are listed at https://dataxapi.com/llms-full.txt. One call returns one page; for more, pass page.next_cursor as cursor in a new call (charged on its own)."
parameters:
  - name: endpoint
    type: string
    required: true
    form: llm
    label:
      en_US: Endpoint ID
      zh_Hans: 接口编号
    human_description:
      en_US: The endpoint's ID, such as douyin.users.get. Every endpoint is listed at dataxapi.com/apis.
      zh_Hans: 接口编号，例如 douyin.users.get。全部接口见 dataxapi.com/apis。
    llm_description: The endpoint ID, dot-separated, such as douyin.videos.comments.list.
  - name: params
    type: string
    required: false
    form: llm
    label:
      en_US: Parameters (JSON)
      zh_Hans: 参数（JSON）
    human_description:
      en_US: 'The parameters as a JSON object, for example {"id": "7694940173372575014"}. Add "cursor" for a next page.'
      zh_Hans: '参数写成 JSON 对象，例如 {"id": "7694940173372575014"}。翻页时加上 "cursor"。'
    llm_description: 'The parameters as a JSON object, for example {"query": "coffee", "sort": "latest"}.'
extra:
  python:
    source: tools/call_endpoint.py
