identity:
  name: keyword_search
  author: dataxapi
  label:
    en_US: Keyword search
    zh_Hans: 关键词搜索
description:
  human:
    en_US: No sign-in to your own platform account; charged per call, errors are not charged, and the price is on the endpoint's page at dataxapi.com/apis. Searches one platform's public posts by keyword, one page a call.
    zh_Hans: 不用登录你自己的平台账号；按次计费、出错不收费，价格见 dataxapi.com/apis 上的接口页。按关键词搜一个平台的公开内容，一次调用一页。
  llm: "No sign-in to the user's own platform account is needed; each call is charged per the endpoint's page at dataxapi.com/apis and errors are not charged. Searches public posts on Douyin, Xiaohongshu, WeChat Channels, WeChat Search (articles and videos), Kuaishou or TikTok by keyword, as standard post objects. One call returns one page; for more, call again with page.next_cursor as cursor (each page is its own charged call)."
parameters:
  - name: platform
    type: select
    required: true
    form: llm
    default: douyin
    label:
      en_US: Platform
      zh_Hans: 平台
    human_description:
      en_US: Which platform to search.
      zh_Hans: 搜哪个平台。
    llm_description: "One of: douyin, xiaohongshu, wechat_channels, wechat (WeChat Search: articles and videos), kuaishou, tiktok."
    options:
      - value: douyin
        label:
          en_US: Douyin
          zh_Hans: 抖音
      - value: xiaohongshu
        label:
          en_US: Xiaohongshu (RedNote)
          zh_Hans: 小红书
      - value: wechat_channels
        label:
          en_US: WeChat Channels
          zh_Hans: 视频号
      - value: wechat
        label:
          en_US: WeChat Search (articles and videos)
          zh_Hans: 微信搜一搜（文章和视频）
      - value: kuaishou
        label:
          en_US: Kuaishou
          zh_Hans: 快手
      - value: tiktok
        label:
          en_US: TikTok
          zh_Hans: TikTok
  - name: query
    type: string
    required: true
    form: llm
    label:
      en_US: Keywords
      zh_Hans: 关键词
    human_description:
      en_US: The search terms.
      zh_Hans: 搜索词。
    llm_description: The search terms.
  - name: sort
    type: select
    required: false
    form: llm
    label:
      en_US: Order
      zh_Hans: 排序
    human_description:
      en_US: The platform's ranking (default), newest first or most liked first. Not used on Kuaishou.
      zh_Hans: 平台默认排序（默认）、新发布的在前，或点赞多的在前。快手不用这一项。
    llm_description: "relevance (default), latest or popular. Ignored for kuaishou."
    options:
      - value: relevance
        label:
          en_US: Relevance
          zh_Hans: 综合
      - value: latest
        label:
          en_US: Newest first
          zh_Hans: 新发布在前
      - value: popular
        label:
          en_US: Most liked first
          zh_Hans: 点赞多
  - name: published_within
    type: select
    required: false
    form: llm
    label:
      en_US: Posted within
      zh_Hans: 发布时间
    human_description:
      en_US: Only posts from the last day, week or half year; any time when empty. Used on Douyin, WeChat Channels, WeChat Search and TikTok.
      zh_Hans: 只要近一天、一周或半年内发布的；留空不限。抖音、视频号、微信搜一搜和 TikTok 用这一项。
    llm_description: "day, week or half_year; leave empty for any time. Used only for douyin, wechat_channels, wechat and tiktok."
    options:
      - value: day
        label:
          en_US: Last day
          zh_Hans: 一天内
      - value: week
        label:
          en_US: Last week
          zh_Hans: 一周内
      - value: half_year
        label:
          en_US: Last half year
          zh_Hans: 半年内
  - name: cursor
    type: string
    required: false
    form: llm
    label:
      en_US: Cursor
      zh_Hans: 翻页游标
    human_description:
      en_US: Leave empty for the first page. For the next page, pass page.next_cursor from the previous result; each page is a charged call.
      zh_Hans: 第一页留空。下一页把上一次结果里的 page.next_cursor 填进来；每一页都是一次收费调用。
    llm_description: Empty for the first page; otherwise page.next_cursor from the previous result, unchanged.
extra:
  python:
    source: tools/keyword_search.py
